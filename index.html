<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Bum-bum zoo</title>
<meta name="description" content="Igra za malu djecu: dodirni životinjice dok iskaču.">
<meta name="theme-color" content="#57c4f0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bum-bum zoo">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&display=swap">
<style>
/* Layout: one full-bleed pixel canvas as the playfield; chunky ink-bordered panels float over it for menu, photo editor, countdown and results. Single bright arcade look. */
:root{
  --ink:#2a1b3d;
  --paper:#fff4d1;
  --white:#ffffff;
  --sun:#ffcf3f;
  --berry:#ff5d8f;
  --leaf:#3fae49;
  --sky:#57c4f0;
  --shade:rgba(42,27,61,.28);
  --font-pixel:"Pixelify Sans","Courier New",monospace;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{
  background:var(--sky);color:var(--ink);font-family:var(--font-pixel);
  overflow:hidden;overscroll-behavior:none;touch-action:none;
  user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;
}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.screen{
  position:fixed;inset:0;display:flex;z-index:3;overflow-y:auto;touch-action:pan-y;
  padding-block:calc(env(safe-area-inset-top,0px) + 16px) calc(env(safe-area-inset-bottom,0px) + 16px);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.panel{
  margin:auto;width:min(100%,460px);background:var(--paper);
  box-shadow:0 0 0 4px var(--ink),8px 8px 0 4px var(--shade);
  padding:20px 18px 22px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;
}
h1,h2,h3{margin:0;line-height:.95;color:var(--berry);text-wrap:balance;letter-spacing:1px;
  text-shadow:-3px 0 var(--ink),3px 0 var(--ink),0 -3px var(--ink),0 3px var(--ink),6px 6px 0 var(--ink)}
h1{font-size:clamp(36px,11vw,62px);white-space:nowrap;animation:bob 1.2s steps(2) infinite}
h2{font-size:clamp(48px,14vw,72px)}
h2.long{font-size:clamp(34px,10vw,52px)}
h3{font-size:clamp(30px,9vw,42px)}
@keyframes bob{50%{transform:translateY(-4px) rotate(-2deg)}}
.lead{margin:0;font-size:22px;font-weight:700}
.choices{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;width:100%}
.choice{
  appearance:none;border:0;cursor:pointer;flex:0 0 calc((100% - 24px)/3);min-width:0;
  background:var(--white);color:var(--ink);font:700 17px var(--font-pixel);
  box-shadow:0 0 0 3px var(--ink),0 5px 0 3px var(--ink);
  padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;
}
.choice span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.choice canvas{width:56px;height:56px;image-rendering:pixelated}
.choice canvas.smooth{image-rendering:auto}
.choice[aria-pressed="true"]{background:var(--sun)}
.choice[aria-pressed="true"] canvas{animation:bob .6s steps(2) infinite}
.choice:active,.level:active,.hbtn:active{transform:translateY(4px)}
.textbtn{appearance:none;border:0;background:none;cursor:pointer;color:var(--ink);font:700 17px var(--font-pixel);text-decoration:underline;text-underline-offset:4px;padding:4px 8px}
.levels{display:flex;gap:12px;width:100%}
.level{
  appearance:none;border:0;cursor:pointer;flex:1 1 0;min-width:0;
  background:var(--white);color:var(--ink);font:700 18px/1.05 var(--font-pixel);
  box-shadow:0 0 0 3px var(--ink),0 5px 0 3px var(--ink);padding:10px 6px;
}
.level[aria-pressed="true"]{background:var(--leaf);color:var(--white);text-shadow:2px 2px 0 var(--ink)}
.big{
  appearance:none;border:0;cursor:pointer;background:var(--berry);color:var(--white);
  font:700 clamp(34px,10vw,46px) var(--font-pixel);letter-spacing:3px;padding:12px 44px 14px;
  text-shadow:3px 3px 0 var(--ink);box-shadow:0 0 0 4px var(--ink),0 8px 0 4px var(--ink);
}
.big:active{transform:translateY(6px);box-shadow:0 0 0 4px var(--ink),0 2px 0 4px var(--ink)}
.big.small{font-size:22px;letter-spacing:1px;padding:10px 18px 12px}
.big.alt{background:var(--leaf)}
.big:disabled{opacity:.45;transform:none}
button:focus-visible,input:focus-visible{outline:4px dashed var(--ink);outline-offset:6px}
.note{margin:0;font-size:17px;opacity:.85}
.row{display:flex;flex-wrap:wrap;gap:16px 18px;justify-content:center}

/* Photo editor */
.crop{width:min(100%,300px);aspect-ratio:1;max-width:100%;box-shadow:0 0 0 4px var(--ink);background:var(--ink);touch-action:none;display:block}
.zoom{width:min(100%,300px);accent-color:var(--berry)}
.field{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:700}
.field input{
  font:700 20px var(--font-pixel);color:var(--ink);background:var(--white);border:0;width:9em;max-width:60vw;
  box-shadow:0 0 0 3px var(--ink);padding:6px 10px;user-select:text;-webkit-user-select:text;
}

#count{align-items:center;justify-content:center;pointer-events:none;background:transparent}
#countNum{
  font:700 min(46vmin,260px) var(--font-pixel);color:var(--sun);line-height:1;
  text-shadow:-6px 0 var(--ink),6px 0 var(--ink),0 -6px var(--ink),0 6px var(--ink),12px 12px 0 var(--ink);
}
#countNum.go{font-size:min(22vmin,140px);color:var(--berry)}
#countNum.pop{animation:pop .5s cubic-bezier(.2,1.8,.4,1)}
@keyframes pop{from{transform:scale(.2)}to{transform:scale(1)}}

#hud{
  position:fixed;left:0;right:0;top:0;z-index:4;pointer-events:none;
  padding-top:calc(env(safe-area-inset-top,0px) + 12px);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:12px;
}
.hud-row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.hud-row.tools{justify-content:flex-end}
.pill{
  background:var(--paper);box-shadow:0 0 0 3px var(--ink),4px 4px 0 3px var(--shade);
  padding:4px 12px 6px;font:700 28px var(--font-pixel);font-variant-numeric:tabular-nums;
  display:flex;align-items:center;gap:10px;
}
.pill small{font-size:15px;letter-spacing:1px}
.pill.danger{background:var(--berry);color:var(--white)}
.bar{width:clamp(60px,22vw,120px);height:14px;background:var(--white);box-shadow:0 0 0 3px var(--ink)}
.bar i{display:block;height:100%;width:100%;background:var(--leaf)}
.bar.low i{background:var(--berry)}
.hbtn{
  pointer-events:auto;appearance:none;border:0;cursor:pointer;min-height:40px;min-width:44px;
  background:var(--paper);color:var(--ink);font:700 16px var(--font-pixel);letter-spacing:1px;
  box-shadow:0 0 0 3px var(--ink),3px 3px 0 3px var(--shade);padding:6px 10px;
  display:flex;align-items:center;justify-content:center;
}
.hbtn svg{width:24px;height:24px;shape-rendering:crispEdges}
.hbtn .x{display:none}
.hbtn[aria-pressed="false"] .waves{display:none}
.hbtn[aria-pressed="false"] .x{display:inline}
.hbtn.armed{background:var(--berry);color:var(--white)}

.score{font-size:clamp(64px,20vw,96px);font-weight:700;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums}
.score small{display:block;font-size:24px;letter-spacing:2px;margin-top:4px}
.record{margin:0;font-size:22px;font-weight:700;color:var(--white);background:var(--leaf);padding:4px 12px;box-shadow:0 0 0 3px var(--ink)}

@media (max-height:700px){
  .panel{gap:10px;padding-block:14px 16px}
  .choice canvas{width:44px;height:44px}
}
@media (prefers-reduced-motion:reduce){
  h1,.choice[aria-pressed="true"] canvas{animation:none}
}
</style>
</head>
<body>

<canvas id="stage" aria-label="Igralište"></canvas>

<div id="hud" hidden>
  <div class="hud-row">
    <div class="pill"><small>BODOVI</small><span id="hudScore">0</span></div>
    <div class="pill" id="timePill"><span id="hudTime">60</span><div class="bar" id="bar"><i id="barFill"></i></div></div>
    <div class="pill" id="escPill" hidden><small>POBJEGLI</small><span id="hudEsc">0/10</span></div>
  </div>
  <div class="hud-row tools">
    <button class="hbtn" id="musicBtn" type="button" aria-label="Glazba" aria-pressed="true">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M1 6h3v4H1zM4 5h1v6H4zM5 4h1v8H5zM6 3h1v10H6zM7 2h1v12H7z"/><path class="waves" fill="currentColor" d="M10 6h1v4h-1zM12 4h1v8h-1zM14 2h1v12h-1z"/><path class="x" fill="currentColor" d="M10 5h1v1h-1zM14 5h1v1h-1zM11 6h1v1h-1zM13 6h1v1h-1zM12 7h1v2h-1zM11 9h1v1h-1zM13 9h1v1h-1zM10 10h1v1h-1zM14 10h1v1h-1z"/></svg>
    </button>
    <button class="hbtn" id="resetBtn" type="button">RESET</button>
    <button class="hbtn" id="quitBtn" type="button">ZAVRŠI</button>
  </div>
</div>

<section class="screen" id="menu">
  <div class="panel">
    <h1>Bum-bum zoo</h1>
    <p class="lead">Koga ćemo loviti?</p>
    <div class="choices" id="choices"></div>
    <button class="textbtn" id="changePhotoBtn" type="button" hidden>Promijeni našu sliku</button>
    <div class="levels" role="group" aria-label="Razina">
      <button class="level" id="level-male" data-level="male" type="button">Male<br>Legende</button>
      <button class="level" id="level-velike" data-level="velike" type="button">Velike<br>Legende</button>
    </div>
    <p class="note" id="levelNote"></p>
    <button class="big" id="startBtn" type="button">START</button>
    <p class="note" id="bestNote"></p>
  </div>
</section>

<section class="screen" id="photo" hidden>
  <div class="panel">
    <h3>Naša slika</h3>
    <canvas class="crop" id="cropCv" width="600" height="600" aria-label="Izrezivanje slike"></canvas>
    <input class="zoom" id="zoomIn" type="range" min="1" max="6" step="0.01" value="1" aria-label="Povećanje slike">
    <p class="note" id="cropNote">Odaberi fotografiju, pa je prstima pomakni i povećaj tako da lice bude u krugu.</p>
    <label class="field" for="faceName">Ime <input id="faceName" type="text" maxlength="12" placeholder="npr. Tata" autocomplete="off"></label>
    <div class="row">
      <button class="big small alt" id="pickBtn" type="button">ODABERI FOTKU</button>
      <button class="big small" id="saveBtn" type="button" disabled>SPREMI</button>
    </div>
    <button class="textbtn" id="cancelBtn" type="button">Odustani</button>
    <input id="fileIn" type="file" accept="image/*" hidden>
  </div>
</section>

<section class="screen" id="count" hidden>
  <div id="countNum">1</div>
</section>

<section class="screen" id="end" hidden>
  <div class="panel">
    <h2 id="endTitle">BRAVO!</h2>
    <div class="score"><span id="endScore">0</span><small>BODOVA</small></div>
    <p class="lead" id="endHits">0 pogodaka</p>
    <p class="record" id="endRecord" hidden>NOVI REKORD!</p>
    <div class="row">
      <button class="big small" id="againBtn" type="button">JOŠ JEDNOM</button>
      <button class="big small alt" id="menuBtn" type="button">IZBORNIK</button>
    </div>
  </div>
</section>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const cv = $('#stage'), ctx = cv.getContext('2d');
const GAME_SECONDS = 60, SPAWN_EVERY = 1.5, POINTS = 10, LIFE = 3.2, MAX_ESCAPES = 10;
const INK = '#2a1b3d';

const store = {
  get(k, d){ try { const v = localStorage.getItem('bumbumzoo.' + k); return v == null ? d : v; } catch (e) { return d; } },
  set(k, v){ try { localStorage.setItem('bumbumzoo.' + k, v); return true; } catch (e) { return false; } },
};

// ---------- Pixel sprites (eyes are 3x3 white boxes; pupils are drawn live) ----------
const SPR = {
  frog: { label: 'Žabe', skin: '#5cc23a', eyes: [[3,1],[10,1]],
    pal: { k:'#1d3b1a', g:'#5cc23a', l:'#c4ec7a', p:'#ff8fb1', w:'#ffffff' },
    rows: [
      '...kkk....kkk...',
      '..kwwwk..kwwwk..',
      '..kwwwk..kwwwk..',
      '..kwwwkkkkwwwk..',
      '.kgkkkggggkkkgk.',
      '.kggggggggggggk.',
      'kgpggggggggggpgk',
      'kggkggggggggkggk',
      'kgggkkkkkkkkgggk',
      '.kggggggggggggk.',
      '..kgllllllllgk..',
      '.kggkllllllkggk.',
      'kgggkkkkkkkkgggk',
      'kkkkk......kkkkk',
    ]},
  ant: { label: 'Mravi', skin: '#e2472c', eyes: [[4,5],[9,5]],
    pal: { k:'#2b0e0a', r:'#e2472c', p:'#ffb0a8', w:'#ffffff' },
    rows: [
      '..k..........k..',
      '...k........k...',
      '....k......k....',
      '....kkkkkkkk....',
      '...krrrrrrrrk...',
      '..krwwwrrwwwrk..',
      '..krwwwrrwwwrk..',
      '..krwwwrrwwwrk..',
      '..kprrrrrrrrpk..',
      '...krrkkkkrrk...',
      '....kkrrrrkk....',
      '..k..krrrrk..k..',
      '...kkrrrrrrkk...',
      '..k.krrrrrrk.k..',
      '.k...krrrrk...k.',
      '......kkkk......',
    ]},
  meerkat: { label: 'Merkati', skin: '#7a4b28', eyes: [[4,3],[9,3]],
    pal: { k:'#3b2412', t:'#cf914f', d:'#7a4b28', l:'#f6dcae', w:'#ffffff' },
    rows: [
      '.....kkkkkk.....',
      '....kttttttk....',
      '...kttttttttk...',
      '..kdwwwttwwwdk..',
      '.ktdwwwttwwwdtk.',
      '..kdwwwttwwwdk..',
      '..kttttkkttttk..',
      '...kttkttkttk...',
      '....kttttttk....',
      '...kttllllttk...',
      '..kttkllllkttk..',
      '...kkllllllkk...',
      '...kttllllttk...',
      '...kttttttttk...',
      '...kttk..kttk...',
      '..kkkk....kkkk..',
    ]},
  penguin: { label: 'Pingvini', skin: '#2f3f73', eyes: [[4,3],[9,3]],
    pal: { k:'#141b33', b:'#2f3f73', f:'#f5f8ff', w:'#ffffff', o:'#ff9f1c', p:'#ff9fb5' },
    rows: [
      '.....kkkkkk.....',
      '....kbbbbbbk....',
      '...kbbbbbbbbk...',
      '..kbwwwbbwwwbk..',
      '..kbwwwffwwwbk..',
      '..kbwwwoowwwbk..',
      '.kbbpfoooofpbbk.',
      '.kbbffffffffbbk.',
      'kbbbffffffffbbbk',
      'kbbbffffffffbbbk',
      'kbbkffffffffkbbk',
      '.kkbffffffffbkk.',
      '..kbffffffffbk..',
      '...kbbbbbbbbk...',
      '...oooo..oooo...',
    ]},
};
const KINDS = ['frog','ant','meerkat','penguin'];
for (const k of KINDS) {
  const sp = SPR[k];
  sp.w = sp.rows[0].length; sp.h = sp.rows.length;
  const c = document.createElement('canvas'); c.width = sp.w; c.height = sp.h;
  const g = c.getContext('2d');
  sp.rows.forEach((row, y) => [...row].forEach((ch, x) => { const col = sp.pal[ch]; if (col) { g.fillStyle = col; g.fillRect(x, y, 1, 1); } }));
  sp.img = c;
}
// Our own photo: a smooth picture inside a pixel frame, 16x16 sprite units like the animals.
SPR.face = { label: 'Naši', skin: '#f4c48e', w: 16, h: 16, isFace: true, img: null, pal: { k: INK } };

const X_EYE = [[0,0],[2,0],[1,1],[0,2],[2,2]];
const STAR = ['..y..','.yyy.','yyyyy','.yyy.','.y.y.'];
const PLASTER = ['.kkkkkkkkkk.','kbbbpppppbbk','kbhbpppppbhk','kbbbpppppbbk','.kkkkkkkkkk.'];
const PLASTER_PAL = { k:'#7a4b28', b:'#f4c48e', p:'#fde7c8', h:'#d9a066' };

// ---------- Backgrounds ----------
const DECO = {
  tuft:   ['d.d.d','.ddd.'],
  flower: ['.y.','yoy','.y.'],
  pad:    ['.gggg.','gggggg','ggg.gg','.gggg.'],
  wave:   ['ww...','..www'],
  sugar:  ['ss','sS'],
  cactus: ['..c..','c.c..','ccc.c','..ccc','..c..','..c..'],
  pebble: ['.mm.','mhmm','.mm.'],
  spark:  ['.w.','www','.w.'],
  crack:  ['a....','.a...','.aa..','...a.'],
  mound:  ['.www.','wwwws'],
};
const THEMES = {
  pond:   { base:'#58b9e6', specks:['#4dacd9','#66c3ee'], decos:[['pad',{g:'#3f9a3a'}],['pad',{g:'#4caf45'}],['wave',{w:'#9ddcf7'}],['flower',{y:'#ff8fb1',o:'#fff3a0'}]] },
  meadow: { base:'#86cf5a', specks:['#79c34e','#93d968'], decos:[['tuft',{d:'#4f9e33'}],['flower',{y:'#ffffff',o:'#ffd23f'}],['flower',{y:'#ff8fb1',o:'#fff3a0'}],['sugar',{s:'#ffffff',S:'#dfe6ee'}]] },
  desert: { base:'#f5dd9f', specks:['#ebcf8a','#fae7b4'], decos:[['cactus',{c:'#4f9a4a'}],['pebble',{m:'#c49a5a',h:'#e0bb7d'}],['tuft',{d:'#b9a24f'}]] },
  ice:    { base:'#dff2fb', specks:['#cfe9f7','#eef9ff'], decos:[['spark',{w:'#ffffff'}],['crack',{a:'#a8d3ea'}],['mound',{w:'#ffffff',s:'#c3e2f2'}]] },
};
const THEME_FOR = { frog:'pond', ant:'meadow', meerkat:'desert', penguin:'ice', mix:'meadow', face:'meadow' };
const SEED_FOR = { frog:7, ant:8, meerkat:9, penguin:10, mix:11, face:12 };

function mulberry32(a){ return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

let bg = null;
function makeBg(){
  const th = THEMES[THEME_FOR[G.kind]];
  const cw = Math.ceil(W / U) + 1, ch = Math.ceil(H / U) + 1;
  const c = document.createElement('canvas'); c.width = cw; c.height = ch;
  const g = c.getContext('2d'), r = mulberry32(SEED_FOR[G.kind]);
  g.fillStyle = th.base; g.fillRect(0, 0, cw, ch);
  for (let y = 0; y < ch; y++) for (let x = 0; x < cw; x++) {
    const v = r(); if (v < 0.09) { g.fillStyle = th.specks[v < 0.045 ? 0 : 1]; g.fillRect(x, y, 1, 1); }
  }
  const n = Math.round(cw * ch / 110);
  for (let i = 0; i < n; i++) {
    const [name, cols] = th.decos[Math.floor(r() * th.decos.length)];
    const pat = DECO[name], px = Math.floor(r() * cw), py = Math.floor(r() * ch);
    pat.forEach((row, y) => [...row].forEach((chr, x) => { const col = cols[chr]; if (col) { g.fillStyle = col; g.fillRect(px + x, py + y, 1, 1); } }));
  }
  bg = c;
}

// ---------- Sound (all synthesized, no files) ----------
let ac = null, master = null, musicBus = null, noiseBuf = null;
function audio(){
  try {
    if (!ac) {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      master = ac.createGain(); master.gain.value = 0.9;
      const comp = ac.createDynamicsCompressor();
      master.connect(comp); comp.connect(ac.destination);
      musicBus = ac.createGain(); musicBus.gain.value = 0.55; musicBus.connect(master);
      noiseBuf = ac.createBuffer(1, Math.floor(ac.sampleRate * 0.05), ac.sampleRate);
      const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (ac.state === 'suspended') ac.resume();
  } catch (e) { ac = null; }
}
function tone(o){
  if (!ac) return;
  const t = o.when != null ? o.when : ac.currentTime + (o.at || 0), dur = o.dur;
  const osc = ac.createOscillator(), g = ac.createGain();
  osc.type = o.type || 'sine';
  osc.frequency.setValueAtTime(o.f0, t);
  if (o.f1) osc.frequency.exponentialRampToValueAtTime(o.f1, t + dur);
  let node = osc;
  if (o.lp) { const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = o.lp; node.connect(f); node = f; }
  node.connect(g); g.connect(o.bus || master);
  const v = o.vol == null ? 0.25 : o.vol;
  g.gain.setValueAtTime(0.0001, t);

const LEAD = [
  72,76,79,76, 84,79,76,79,  77,81,84,81, 77,81,79,77,
  79,83,86,83, 79,77,76,74,  76,79,72,76, 79,0,84,0,

function musicTempo(){ return MUSIC_BPM * (1 + (G.speed - 1) * 0.5); }
function musicStart(){
  if (!ac) return;

  if (!mus.timer) mus.timer = setInterval(musicTick, 25);
}
function musicStop(){ mus.playing = false; clearInterval(mus.timer); mus.timer = null; }
function musicTick(){
  if (!mus.playing || !mus.on || !ac) return;
  const stepDur = 60 / musicTempo() / 2;
  if (mus.next < ac.currentTime) mus.next = ac.currentTime + 0.03;
  while (mus.next < ac.currentTime + 0.12) {
    const i = mus.step, t = mus.next, root = ROOTS[Math.floor(i / 8)];
    if (LEAD[i]) tone({type:'square', f0:midi(LEAD[i]), dur:stepDur * .85, vol:.07, when:t, bus:musicBus});
    tone({type:'triangle', f0:midi(i % 2 ? root + 12 : root), dur:stepDur * .8, vol:.16, when:t, bus:musicBus});
    if (i % 4 === 0) tone({f0:150, f1:45, dur:.12, vol:.3, when:t, bus:musicBus});
    if (i % 2 === 1) {
      const n = ac.createBufferSource(), hp = ac.createBiquadFilter(), g = ac.createGain();
      n.buffer = noiseBuf; hp.type = 'highpass'; hp.frequency.value = 6000; g.gain.value = .07;

// ---------- Drawing ----------
const easeOutBack = p => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); };

  pat.forEach((row, y) => [...row].forEach((ch, x) => {
    if (ch === '.') return;
    if (pal) c.fillStyle = pal[ch];
    c.fillRect(ox + x, oy + y, 1, 1);

}

      c.fillStyle = '#ffffff'; c.fillRect(ex, ey, 3, 3);
      c.fillStyle = sp.pal.k; for (const [px, py] of X_EYE) c.fillRect(ex + px, ey + py, 1, 1);

      c.fillStyle = '#111111'; c.fillRect(ex + a.lx, ey + a.ly, 2, 2);
      c.fillStyle = '#ffffff'; c.fillRect(ex + a.lx, ey + a.ly, 1, 1);

function drawStars(c, sp, a, front){
  const cx = sp.w / 2, cy = -2;

    const ang = a.st * 6 + i * Math.PI * 2 / 3, s = Math.sin(ang);
    if ((s >= 0) !== front) continue;

function drawAnimal(a){

  if (a.state === 'pop') { sx = sy = Math.max(0.01, easeOutBack(Math.min(1, a.st / .3))); }

// ---------- Loop ----------
let last = performance.now();
function frame(now){
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (G.mode === 'play') {
    G.spawnIn -= dt;
    if (G.spawnIn <= 0) { spawn(); G.spawnIn += SPAWN_EVERY / G.speed; }
    if (G.level === 'male') {
      G.time -= dt;
      if (G.time <= 0) { G.time = 0; finish('time'); }
    }
    updateHud();
  }
  for (const a of G.animals) stepAnimal(a, dt);
  G.animals = G.animals.filter(a => !a.dead);
  for (const f of G.fx) {
    f.t += dt;
    if (f.type === 'part' || f.type === 'conf') { f.x += f.vx * dt; f.y += f.vy * dt; }
  }
  G.fx = G.fx.filter(f => f.t < f.life);
  render();

}

    const b = document.createElement('button');
    b.type = 'button'; b.className = 'choice'; b.id = 'choice-' + k; b.dataset.kind = k;
    const label = k === 'mix' ? 'Sve' : SPR[k].label;
    b.append(iconCanvas(k), Object.assign(document.createElement('span'), { textContent: label }));
    b.addEventListener('click', () => {
      audio();
      if (k === 'face' && !SPR.face.img) { openPhoto(true); return; }
      G.kind = k; store.set('kind', k); refreshMenu(); makeBg();
      if (k === 'mix') sfxPop(); else VOICES[k](1);
    });
    choices.append(b);
  });
}
const LEVEL_NOTES = {
  male: '1 minuta, uvijek isti tempo.',
  velike: 'Svakim pogotkom sve brže! Ako pobjegne 10 likova, kraj.',
};
function refreshMenu(){
  choices.querySelectorAll('.choice').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.kind === G.kind)));
  document.querySelectorAll('.level').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.level === G.level)));
  $('#levelNote').textContent = LEVEL_NOTES[G.level];
  changePhotoBtn.hidden = !SPR.face.img;
  const best = getBest();
  $('#bestNote').textContent = best > 0 ? `Najbolji rezultat: ${best} bodova` : 'Dodirni lika i on se onesvijesti!';
}
document.querySelectorAll('.level').forEach(b => b.addEventListener('click', () => {
  G.level = b.dataset.level; store.set('level', G.level); refreshMenu();
}));
changePhotoBtn.addEventListener('click', () => openPhoto(false));

// ---------- Our photo: pick, crop in a circle, save one picture on this phone ----------
const cropCv = $('#cropCv'), cctx = cropCv.getContext('2d'), zoomIn = $('#zoomIn'), fileIn = $('#fileIn');
const saveBtn = $('#saveBtn'), faceName = $('#faceName'), cropNote = $('#cropNote');
const C = cropCv.width, CX = C / 2, CY = C / 2, R = C * 0.4;
const crop = { img:null, s:1, min:1, ox:0, oy:0, ptrs:new Map(), prev:null };

function loadFace(){
  const data = store.get('face', '');
  SPR.face.label = store.get('faceName', '') || 'Naši';
  if (!data) return;
  const im = new Image();
  im.onload = () => { SPR.face.img = im; buildChoices(); refreshMenu(); };
  im.src = data;
}
function openPhoto(pickNow){
  crop.img = null; saveBtn.disabled = !SPR.face.img;
  faceName.value = store.get('faceName', '');
  zoomIn.value = 1; drawCrop();
  menu.hidden = true; photo.hidden = false;
  if (pickNow) fileIn.click();
}
function closePhoto(){ photo.hidden = true; menu.hidden = false; refreshMenu(); }
fileIn.addEventListener('change', () => {
  const f = fileIn.files && fileIn.files[0]; fileIn.value = '';
  if (!f) return;
  const url = URL.createObjectURL(f), im = new Image();
  im.onload = () => {
    crop.img = im;
    crop.min = 2 * R / Math.min(im.naturalWidth, im.naturalHeight);
    crop.s = crop.min * (C / (2 * R));
    crop.ox = CX - im.naturalWidth * crop.s / 2; crop.oy = CY - im.naturalHeight * crop.s / 2;
    clampCrop(); zoomIn.value = crop.s / crop.min; drawCrop();
    saveBtn.disabled = false;
    cropNote.textContent = 'Pomakni i povećaj sliku prstima tako da lice bude u krugu.';
    URL.revokeObjectURL(url);
  };
  im.onerror = () => { cropNote.textContent = 'Ova slika se ne može otvoriti. Odaberi drugu fotografiju.'; URL.revokeObjectURL(url); };
  im.src = url;
});
function clampCrop(){
  const w = crop.img.naturalWidth * crop.s, h = crop.img.naturalHeight * crop.s;
  crop.ox = Math.min(CX - R, Math.max(CX + R - w, crop.ox));
  crop.oy = Math.min(CY - R, Math.max(CY + R - h, crop.oy));
}
function zoomAbout(newS, px, py){
  newS = Math.min(crop.min * 6, Math.max(crop.min, newS));
  crop.ox = px - (px - crop.ox) * (newS / crop.s);
  crop.oy = py - (py - crop.oy) * (newS / crop.s);
  crop.s = newS; clampCrop();
}
function drawCrop(){
  cctx.fillStyle = INK; cctx.fillRect(0, 0, C, C);
  if (!crop.img) {
    cctx.fillStyle = '#fff4d1'; cctx.font = '700 40px "Pixelify Sans", monospace'; cctx.textAlign = 'center';
    if (SPR.face.img) {
      cctx.imageSmoothingEnabled = true; cctx.drawImage(SPR.face.img, CX - R, CY - R, 2 * R, 2 * R);
    } else cctx.fillText('Nema slike', CX, CY + 14);
    return;
  }
  cctx.imageSmoothingEnabled = true; cctx.imageSmoothingQuality = 'high';
  cctx.drawImage(crop.img, crop.ox, crop.oy, crop.img.naturalWidth * crop.s, crop.img.naturalHeight * crop.s);
  cctx.fillStyle = 'rgba(42,27,61,.62)';
  cctx.beginPath(); cctx.rect(0, 0, C, C); cctx.arc(CX, CY, R, 0, Math.PI * 2, true); cctx.fill();
  cctx.lineWidth = 6; cctx.strokeStyle = '#ffcf3f'; cctx.setLineDash([18, 12]);
  cctx.beginPath(); cctx.arc(CX, CY, R, 0, Math.PI * 2); cctx.stroke(); cctx.setLineDash([]);
}
function cropPoint(e){ const r = cropCv.getBoundingClientRect(); return { x:(e.clientX - r.left) * C / r.width, y:(e.clientY - r.top) * C / r.height }; }
function pinchState(){
  const p = [...crop.ptrs.values()];
  if (p.length < 2) return { mx:p[0].x, my:p[0].y, d:0 };
  return { mx:(p[0].x + p[1].x) / 2, my:(p[0].y + p[1].y) / 2, d:Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y) };
}
cropCv.addEventListener('pointerdown', e => {
  if (!crop.img) return;
  cropCv.setPointerCapture(e.pointerId);
  crop.ptrs.set(e.pointerId, cropPoint(e)); crop.prev = pinchState();
});
cropCv.addEventListener('pointermove', e => {
  if (!crop.ptrs.has(e.pointerId)) return;
  crop.ptrs.set(e.pointerId, cropPoint(e));
  const now = pinchState(), prev = crop.prev;
  if (prev.d && now.d) zoomAbout(crop.s * now.d / prev.d, now.mx, now.my);
  crop.ox += now.mx - prev.mx; crop.oy += now.my - prev.my; clampCrop();
  crop.prev = now; zoomIn.value = crop.s / crop.min; drawCrop();
});
['pointerup','pointercancel'].forEach(t => cropCv.addEventListener(t, e => {
  crop.ptrs.delete(e.pointerId); crop.prev = crop.ptrs.size ? pinchState() : null;
}));
cropCv.addEventListener('wheel', e => { if (!crop.img) return; e.preventDefault(); const p = cropPoint(e); zoomAbout(crop.s * (e.deltaY < 0 ? 1.1 : 0.9), p.x, p.y); zoomIn.value = crop.s / crop.min; drawCrop(); }, { passive:false });
zoomIn.addEventListener('input', () => { if (!crop.img) return; zoomAbout(crop.min * parseFloat(zoomIn.value), CX, CY); drawCrop(); });

// The saved picture: 32x32 grid of 8px cells; photo inside a stepped pixel circle, thick ink frame around it.
function buildFace(){
  const N = 32, CELL = 8, S = N * CELL, INNER = 13.2, OUTER = 15.6;
  const out = document.createElement('canvas'); out.width = out.height = S;
  const g = out.getContext('2d');
  const dist = (x, y) => Math.hypot(x + .5 - N / 2, y + .5 - N / 2);
  const span = R * (N / 2) / INNER;                     // crop circle maps onto the inner photo area
  const sx = (CX - span - crop.ox) / crop.s, sy = (CY - span - crop.oy) / crop.s, sw = 2 * span / crop.s;
  g.save(); g.beginPath();
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) if (dist(x, y) < INNER) g.rect(x * CELL, y * CELL, CELL, CELL);
  g.clip(); g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'high';
  g.drawImage(crop.img, sx, sy, sw, sw, 0, 0, S, S);
  g.restore();
  g.fillStyle = INK;
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) { const d = dist(x, y); if (d >= INNER && d < OUTER) g.fillRect(x * CELL, y * CELL, CELL, CELL); }
  return out;
}
saveBtn.addEventListener('click', () => {
  const name = faceName.value.trim().slice(0, 12);
  store.set('faceName', name); SPR.face.label = name || 'Naši';
  if (crop.img) {
    const c = buildFace();
    let data = c.toDataURL('image/webp', 0.9);
    if (!data.startsWith('data:image/webp')) data = c.toDataURL('image/png');
    if (!store.set('face', data)) { cropNote.textContent = 'Slika se nije spremila. Probaj ponovno ili odaberi manju sliku.'; return; }
    SPR.face.img = c;
  }
  G.kind = 'face'; store.set('kind', 'face');
  buildChoices(); makeBg(); closePhoto();
});
$('#pickBtn').addEventListener('click', () => fileIn.click());
$('#cancelBtn').addEventListener('click', closePhoto);

// ---------- Game flow ----------
let wake = null;
async function keepAwake(){ try { if ('wakeLock' in navigator) wake = await navigator.wakeLock.request('screen'); } catch (e) {} }
document.addEventListener('visibilitychange', () => {
  if (!ac) return;
  if (document.visibilityState === 'hidden') ac.suspend();
  else { ac.resume(); if (G.mode !== 'menu') keepAwake(); }
});
function later(fn, ms){ G.timers.push(setTimeout(fn, ms)); }
function clearTimers(){ G.timers.forEach(clearTimeout); G.timers = []; }

function startGame(){
  audio(); keepAwake(); clearTimers(); musicStop();
  try { const el = document.documentElement; if (!document.fullscreenElement && el.requestFullscreen) el.requestFullscreen({ navigationUI:'hide' }).catch(() => {}); } catch (e) {}
  menu.hidden = true; end.hidden = true;
  G.animals = []; G.fx = []; G.score = 0; G.hits = 0; G.escaped = 0; G.speed = 1; G.time = GAME_SECONDS;
  makeBg();
  hud.hidden = false; shownScore = shownTime = -1; updateHud();
  G.mode = 'count'; count.hidden = false;
  const steps = ['1','2','3','KRENI!'], freqs = [523, 587, 659];
  steps.forEach((s, i) => later(() => {
    countNum.textContent = s;
    countNum.classList.toggle('go', i === 3);
    countNum.classList.remove('pop'); void countNum.offsetWidth; countNum.classList.add('pop');
    if (i < 3) sfxBeep(freqs[i]); else sfxGo();
  }, i * 1000));
  later(() => { count.hidden = true; G.mode = 'play'; G.spawnIn = 0; musicStart(); }, 3700);
}
function plural(n, one, few, many){ const a = n % 10, b = n % 100; if (a === 1 && b !== 11) return one; if (a >= 2 && a <= 4 && (b < 12 || b > 14)) return few; return many; }
function finish(reason){
  if (G.mode !== 'play' && G.mode !== 'count') return;
  clearTimers(); musicStop(); count.hidden = true;
  G.mode = 'over'; G.endReason = reason;
  for (const a of G.animals) if (a.state !== 'dizzy') setState(a, 'leave');
  later(showEnd, reason === 'quit' ? 250 : 900);
}
function showEnd(){
  const best = getBest(), isRecord = G.score > best;
  if (isRecord) store.set(bestKey(), String(G.score));
  const lost = G.endReason === 'lost';
  const title = $('#endTitle');
  title.textContent = lost ? 'GOTOV SI LEGENDO!' : 'BRAVO!';
  title.classList.toggle('long', lost);
  $('#endScore').textContent = G.score;
  $('#endHits').textContent = `${G.hits} ${plural(G.hits, 'pogodak', 'pogotka', 'pogodaka')}`;
  $('#endRecord').hidden = !isRecord || G.score === 0;
  hud.hidden = true; end.hidden = false; G.mode = 'end';
  if (lost) sfxBelj(); else sfxFanfare();
  confetti();
  // Short lock so a toddler's leftover taps don't restart straight away.
  const btns = end.querySelectorAll('button'); btns.forEach(b => b.disabled = true);
  later(() => btns.forEach(b => b.disabled = false), 1500);
}

// Reset and Završi need two taps, so a stray toddler tap doesn't end the game.
function confirmTap(btn, action){
  const label = btn.textContent; let tid = 0;
  const disarm = () => { clearTimeout(tid); tid = 0; btn.textContent = label; btn.classList.remove('armed'); };
  btn.addEventListener('click', () => {
    if (tid) { disarm(); action(); return; }
    btn.textContent = 'SIGURNO?'; btn.classList.add('armed');
    tid = setTimeout(disarm, 2500);
  });
}
confirmTap($('#resetBtn'), startGame);
confirmTap($('#quitBtn'), () => finish('quit'));
const musicBtn = $('#musicBtn');
function setMusic(on){
  mus.on = on; store.set('music', on ? '1' : '0');
  musicBtn.setAttribute('aria-pressed', String(on));
  musicBtn.setAttribute('aria-label', on ? 'Ugasi glazbu' : 'Upali glazbu');
  if (musicBus) musicBus.gain.value = on ? 0.55 : 0;
  if (on && ac) mus.next = ac.currentTime + 0.05;
}
musicBtn.addEventListener('click', () => setMusic(!mus.on));

$('#startBtn').addEventListener('click', startGame);
$('#againBtn').addEventListener('click', startGame);
$('#menuBtn').addEventListener('click', () => { end.hidden = true; menu.hidden = false; G.mode = 'menu'; G.fx = []; G.animals = []; refreshMenu(); });

// ---------- Boot ----------
window.addEventListener('resize', resize);
if (G.kind === 'face' && !store.get('face', '')) G.kind = 'frog';
loadFace(); buildChoices(); resize(); refreshMenu(); setMusic(mus.on);
if (document.fonts && document.fonts.load) document.fonts.load('700 20px "Pixelify Sans"').catch(() => {});
requestAnimationFrame(frame);

// Offline support once installed as an app.
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
})();
</script>
